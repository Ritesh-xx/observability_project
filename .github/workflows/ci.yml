name: Observability Lab CI

on:
  push:
    branches:
      - dev_branch_1
  pull_request:
    branches:
      - dev_branch_1

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python files
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            python:3.13-slim \
            python -m py_compile \
              app/app.py \
              external-api.py \
              loadtest/locustfile.py

      - name: Run application tests
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            python:3.13-slim \
            bash -c \
            "pip install --no-cache-dir -r app/requirements.txt pytest && pytest -v"

      - name: Build Docker image
        run: |
          docker build -t observability-lab-app ./app
